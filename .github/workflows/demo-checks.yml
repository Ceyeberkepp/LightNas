name: LightNAS interactive demo checks

on:
  pull_request:
    paths:
      - 'demo/**'
      - '.github/workflows/demo-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'demo/**'
      - '.github/workflows/demo-checks.yml'

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check demo script syntax
        run: |
          node --check demo/app.js
          node --check demo/server.mjs
          node --check demo/demo.test.mjs
      - name: Test demo server and isolation
        run: node --test demo/demo.test.mjs
      - name: Build isolated demo image
        run: docker build --file demo/Dockerfile --tag lightnas-demo:ci .
