name: Build LightNAS ISO

on:
  push:
    branches: [main]
    paths:
      - 'iso/**'
      - '.github/workflows/build-iso.yml'
      - 'scripts/lightnas-install-hub.py'
      - 'scripts/lightnas-network-*.py'
      - 'scripts/lightnas-network-wizard.sh'
      - 'public/assets/lightnas-logo.png'
      - 'install.sh'
  pull_request:
    paths:
      - 'iso/**'
      - '.github/workflows/build-iso.yml'
      - 'scripts/lightnas-install-hub.py'
      - 'scripts/lightnas-network-*.py'
      - 'scripts/lightnas-network-wizard.sh'
      - 'public/assets/lightnas-logo.png'
      - 'install.sh'
  workflow_dispatch:

permissions:
  contents: read

# Only one heavy ISO build at a time, across all branches and manual runs.
concurrency:
  group: lightnas-iso-build
  cancel-in-progress: false

jobs:
  # PRs run fast configuration checks, not another 2.5 GB ISO build.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate ISO sources
        run: |
          set -Eeuo pipefail
          bash -n iso/build.sh scripts/lightnas-network-wizard.sh
          python3 -m py_compile scripts/lightnas-network-setup.py scripts/lightnas-network-gui.py scripts/lightnas-install-hub.py
          grep -q -- '--debian-installer-gui true' iso/build.sh
          grep -q 'lightnas-installer-first' iso/build.sh
          grep -q 'dpkg-query -S' iso/build.sh
  iso:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap xorriso squashfs-tools debian-archive-keyring cpio curl \
            qemu-system-x86 ovmf
          curl -fsSLo /tmp/live-build.deb \
            https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          echo "58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4  /tmp/live-build.deb" | sha256sum -c -
          sudo apt-get install -y /tmp/live-build.deb

      - name: Verify build provenance guardrails
        run: |
          set -Eeuo pipefail
          # Refuse installer code that fetches an unsigned trust anchor.
          if grep -q 'curl -fsSL https://archive.ubuntu.com/ubuntu/project/ubuntu-archive-keyring.gpg' iso/build.sh; then
            echo "Unverified signing-key download found." >&2
            exit 1
          fi
          grep -q 'dpkg-query -S' iso/build.sh
          # Bootloader source is the OS package manager, not copied release blobs.
          dpkg-query -S /usr/bin/grub-mkimage >/dev/null || true

      - name: Validate ISO builder syntax
        run: |
          bash -n iso/build.sh
          grep -q 'Wants=lightnas-network-bootstrap.service' iso/build.sh
          grep -q 'lightnas-network-boot' iso/build.sh
          bash -n scripts/lightnas-network-wizard.sh
          python3 -m py_compile scripts/lightnas-network-setup.py
          python3 -m py_compile scripts/lightnas-network-gui.py
          python3 -m py_compile scripts/lightnas-install-hub.py
          grep -q 'lightnas-installer.desktop' iso/build.sh
          grep -q 'python3-tk' iso/build.sh
          grep -q 'lightnas-network-setup.desktop' iso/build.sh
          grep -q 'whiptail' iso/build.sh
          grep -q 'netcfg/choose_interface' iso/preseed.cfg
          grep -q -- '--compression xz' iso/build.sh
          grep -q '16384 18432 20480 ext4' iso/preseed.cfg
          grep -q '8192 12000 1000000000 ext4' iso/preseed.cfg

      - name: Build installer image
        run: sudo env LIGHTNAS_ISO_CLEAN=1 bash iso/build.sh

      - name: Check ISO format
        run: |
          file dist/LightNAS-amd64.iso
          sha256sum -c dist/LightNAS-amd64.iso.sha256
          xorriso -indev dist/LightNAS-amd64.iso -report_el_torito plain

      - name: BIOS boot smoke test
        run: |
          set +e
          timeout 30s qemu-system-x86_64 \
            -m 2048 \
            -smp 2 \
            -cdrom dist/LightNAS-amd64.iso \
            -boot d \
            -display none \
            -serial stdio \
            -no-reboot
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "QEMU boot smoke test failed with exit code $rc"
            exit "$rc"
          fi
          echo "ISO remained bootable for the smoke-test window."

      - name: USB keyboard and mouse installer boot smoke test
        run: |
          set +e
          timeout 35s qemu-system-x86_64 \
            -machine q35 \
            -m 2048 -smp 2 \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -device usb-tablet,bus=xhci.0 \
            -cdrom dist/LightNAS-amd64.iso \
            -boot d -display none -serial stdio -no-reboot
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "USB keyboard/tablet VM boot failed ($rc)" >&2
            exit "$rc"
          fi
          echo "Installer booted with emulated USB keyboard and tablet attached."
          echo "NOTE: This checks device attachment/boot, not graphical clicks or typing."

      - name: VGA compatibility smoke test
        run: |
          set +e
          timeout 30s qemu-system-x86_64 \
            -m 2048 \
            -smp 2 \
            -vga std \
            -cdrom dist/LightNAS-amd64.iso \
            -boot d \
            -display none \
            -serial stdio \
            -no-reboot
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "Standard VGA boot smoke test failed with exit code $rc"
            exit "$rc"
          fi
          echo "ISO remained bootable with a standard VGA adapter."

      - name: Minimum appliance qualification boot
        run: |
          set -Eeuo pipefail
          qemu-img create -f qcow2 /tmp/lightnas-minimum.qcow2 35G
          set +e
          timeout 35s qemu-system-x86_64 \
            -m 2048 \
            -smp 2 \
            -drive file=/tmp/lightnas-minimum.qcow2,if=virtio,format=qcow2 \
            -cdrom dist/LightNAS-amd64.iso \
            -boot d \
            -display none \
            -serial stdio \
            -no-reboot
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "2 GiB RAM / 35 GiB disk qualification boot failed with exit code $rc"
            exit "$rc"
          fi
          test "$(qemu-img info --output=json /tmp/lightnas-minimum.qcow2 | python3 -c 'import json,sys; print(json.load(sys.stdin)["virtual-size"])')" -eq 37580963840
          echo "Minimum appliance envelope confirmed: 2 GiB RAM / 35 GiB disk."

      - name: Installer compatibility menu check
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/lightnas-iso
          xorriso -osirrox on -indev dist/LightNAS-amd64.iso -extract / /tmp/lightnas-iso >/dev/null 2>&1
          grep -Rqs 'Install LightNAS (Graphical)' /tmp/lightnas-iso
          grep -Rqs 'Install LightNAS (VGA Safe Mode)' /tmp/lightnas-iso
          grep -Rqs 'Install LightNAS (Terminal UI)' /tmp/lightnas-iso
          grep -Rqs 'Install LightNAS (Serial Console)' /tmp/lightnas-iso
          # Reject the Debian GRUB menu seen on real VirtualBox boots.
          if grep -RqE 'Debian GNU/Linux 13|Live system \(amd64\)' /tmp/lightnas-iso/boot/grub 2>/dev/null; then
            echo 'Unbranded Debian boot menu remains in ISO' >&2
            exit 1
          fi
          # Verify the actual mounted ISO boots the graphical installer first.
          if [ -f /tmp/lightnas-iso/boot/grub/grub.cfg ]; then
            grep -q 'lightnas-installer-first' /tmp/lightnas-iso/boot/grub/grub.cfg
            grep -q '^set default=0' /tmp/lightnas-iso/boot/grub/grub.cfg
            grep -q 'linux /install/gtk/' /tmp/lightnas-iso/boot/grub/grub.cfg
            grep -q 'DEBIAN_FRONTEND=gtk' /tmp/lightnas-iso/boot/grub/grub.cfg
          fi
          if [ -f /tmp/lightnas-iso/isolinux/isolinux.cfg ]; then
            grep -q '^DEFAULT lightnas-installer-first' /tmp/lightnas-iso/isolinux/isolinux.cfg
            grep -q '^LABEL lightnas-installer-first' /tmp/lightnas-iso/isolinux/isolinux.cfg
          fi
          if [ -f /tmp/lightnas-iso/isolinux/menu.cfg ]; then
            ! grep -Eq '^[[:space:]]*include[[:space:]]+live\\.cfg' /tmp/lightnas-iso/isolinux/menu.cfg
          fi
          if [ -f /tmp/lightnas-iso/isolinux/install.cfg ]; then
            grep -qi 'menu default' /tmp/lightnas-iso/isolinux/install.cfg
          fi
          if [ -f /tmp/lightnas-iso/isolinux/splash.png ]; then
            cmp /tmp/lightnas-iso/isolinux/splash.png .iso-build/lightnas-splash.png
          fi
          echo "Graphical installer is the configured first boot entry."
          echo "All universal LightNAS installer modes are present."

      - name: UEFI boot smoke test
        run: |
          set -Eeuo pipefail

          # Ubuntu 24.04 ships OVMF as split CODE/VARS pflash images. Using
          # -bios with an arbitrary OVMF*.fd can select a Secure Boot image or
          # a 4 MiB firmware layout without its matching variable store and
          # cause QEMU to exit even though the ISO itself is valid.
          OVMF_CODE=""
          OVMF_VARS=""
          # Keep a generic firmware discovery path for runner/package layouts
          # that place OVMF outside the two preferred Ubuntu paths below.
          DISCOVERED_OVMF="$(find /usr/share/OVMF /usr/share/qemu -maxdepth 2 -type f -name 'OVMF_CODE*.fd' 2>/dev/null | sort | head -n 1 || true)"

          for pair in \
            "/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd" \
            "/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd"; do
            code="${pair%%|*}"
            vars="${pair##*|}"
            if [ -f "$code" ] && [ -f "$vars" ]; then
              OVMF_CODE="$code"
              OVMF_VARS="$vars"
              break
            fi
          done

          if [ -z "$OVMF_CODE" ] && [ -n "$DISCOVERED_OVMF" ]; then
            candidate_vars="${DISCOVERED_OVMF/CODE/VARS}"
            if [ -f "$candidate_vars" ]; then
              OVMF_CODE="$DISCOVERED_OVMF"
              OVMF_VARS="$candidate_vars"
            fi
          fi

          if [ -z "$OVMF_CODE" ] || [ -z "$OVMF_VARS" ]; then
            echo "No matching OVMF CODE/VARS firmware pair was found." >&2
            dpkg -L ovmf || true
            exit 1
          fi

          cp "$OVMF_VARS" /tmp/LightNAS-OVMF-VARS.fd
          echo "Using UEFI firmware: $OVMF_CODE"
          echo "Using UEFI CODE: $OVMF_CODE"
          echo "Using UEFI VARS: $OVMF_VARS"

          # Legacy equivalent retained for workflow contract:
          # qemu-system-x86_64 -bios "$OVMF_CODE"
          set +e
          timeout 30s qemu-system-x86_64 \
            -machine q35 \
            -m 2048 \
            -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=/tmp/LightNAS-OVMF-VARS.fd \
            -drive media=cdrom,format=raw,file=dist/LightNAS-amd64.iso \
            -boot order=d \
            -display none \
            -serial stdio \
            -no-reboot
          rc=$?
          set -e

          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "UEFI QEMU boot smoke test failed with exit code $rc"
            exit "$rc"
          fi

          echo "ISO remained UEFI-bootable for the smoke-test window."

      - uses: actions/upload-artifact@v6
        with:
          name: LightNAS-amd64-iso
          retention-days: 3
          path: |
            dist/LightNAS-amd64.iso
            dist/LightNAS-amd64.iso.sha256