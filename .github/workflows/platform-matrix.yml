name: Native platform runtime qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/platform-support.json'
      - 'config/kubernetes-release.json'
      - '.github/workflows/platform-matrix.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/platform-support.json'
      - 'config/kubernetes-release.json'
      - '.github/workflows/platform-matrix.yml'
permissions:
  contents: read
jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            image: node:22-bookworm-slim
          - architecture: arm64
            platform: linux/arm64
            image: node:22-bookworm-slim
          - architecture: armhf
            platform: linux/arm/v7
            image: node:22-bookworm-slim
          - architecture: riscv64
            platform: linux/riscv64
            # Trixie ships Node 20; source compilation under QEMU exceeds this
            # runtime-test budget. Sid provides a maintained native Node 24.
            # This qualifies the Sid runtime, not the Trixie source-build path.
            image: debian:sid-slim
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64,riscv64
      - name: Execute native ISA runtime, API and compatibility tests
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_IMAGE: ${{ matrix.image }}
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          docker run --rm --platform "$TARGET_PLATFORM" -e EXPECTED_ARCH -v "$PWD:/source:ro" "$TARGET_IMAGE" bash -ec '
            apt-get update
            apt-get install -y --no-install-recommends python3 curl openssl util-linux
            if ! command -v node >/dev/null; then apt-get install -y nodejs npm; fi
            cp -a /source /work
            cd /work
            python3 scripts/platform-preflight.py --architecture "$EXPECTED_ARCH"
            LIGHTNAS_ARCH="$EXPECTED_ARCH" bash scripts/install-node-runtime.sh
            npm install --omit=dev --no-audit --no-fund
            node --test test/platform-qualification.test.mjs test/kubernetes.test.mjs
            python3 -m unittest discover -s test -p platform_preflight_test.py
            mkdir -p /tmp/lightnas-smoke
            NAS_DATA_FILE=/tmp/lightnas-smoke/state.json NAS_HOST=127.0.0.1 NAS_PORT=3081 NODE_OPTIONS=--max-old-space-size=256 node src/server.mjs >/tmp/lightnas-smoke/log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:3081/api/status && exit 0; sleep 1; done
            cat /tmp/lightnas-smoke/log
            exit 1
          '
  full-i386:
    runs-on: ubuntu-latest
    # A serial Node 22 source build exceeded three hours on the hosted runner.
    # Keep the complete build and runtime checks, with a larger CI-only budget.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      # Docker Engine 29.4.2 denied socketcall(2), breaking i386 glibc DNS.
      # Docker 29.4.3 restores legitimate 32-bit sockets and enforces the
      # AF_ALG restriction through AppArmor/SELinux (CVE-2026-31431).
      # Pin the fixed engine rather than disabling seccomp or using host DNS.
      - name: Install security-corrected Docker Engine for i386
        uses: docker/setup-docker-action@v5
        with:
          version: v29.4.3
      - name: Verify Docker Engine and container confinement
        run: |
          docker version
          test "$(docker version --format '{{.Server.Version}}')" = "29.4.3"
          docker info --format '{{json .SecurityOptions}}' | tee /tmp/lightnas-docker-security.json
          grep -q 'name=seccomp' /tmp/lightnas-docker-security.json
          grep -q 'name=apparmor' /tmp/lightnas-docker-security.json
      - name: Build native 32-bit runtime and test live API and security regressions
        run: |
          # Use the default isolated container network and default seccomp.
          # A failing DNS lookup is a hard error, never skipped.
          docker run --rm --platform linux/386 -v "$PWD:/source:ro" debian:bookworm-slim bash -ec '
            test "$(dpkg --print-architecture)" = "i386"
            grep -q "^Seccomp:[[:space:]]*2$" /proc/self/status
            getent ahostsv4 deb.debian.org
            apt-get update
            apt-get install -y --no-install-recommends python3 curl ca-certificates
            # The CVE-2026-31431 mitigation must still deny AF_ALG sockets.
            python3 -c "import socket, unittest; unittest.TestCase().assertRaises(PermissionError, socket.socket, socket.AF_ALG, socket.SOCK_SEQPACKET, 0)"
            cp -a /source /work
            cd /work
            LIGHTNAS_ARCH=i386 LIGHTNAS_RUNTIME_BUILD_JOBS=2 bash scripts/install-node-runtime.sh
            node -e "if(process.arch!==\"ia32\")process.exit(1)"
            npm install --omit=dev --no-audit --no-fund
            # Exercise the actual ia32 runtime against the live upload route.
            node --test \
              test/platform-qualification.test.mjs \
              test/kubernetes.test.mjs \
              test/api-rate-limit.test.mjs \
              test/upload-rate-budget-live.test.mjs \
              test/mobile-upload-dock-cleanup.test.mjs \
              test/profile-image-source.test.mjs \
              test/remote-storage-entities.test.mjs
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p platform_preflight_test.py
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p host_config_writer_test.py
          '
