name: LXC isolated extraction tests
on:
  pull_request:
    paths:
      - 'scripts/lxc-isolated-extract.py'
      - 'test/test_lxc_isolated_extract.py'
      - 'test/test_lxc_stage_verify.py'
      - 'scripts/lxc-verify-staged-rootfs.py'
      - '.github/workflows/lxc-extraction-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lxc-isolated-extract.py'
      - 'test/test_lxc_isolated_extract.py'
      - '.github/workflows/lxc-extraction-tests.yml'
permissions:
  contents: read
jobs:
  safe-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated archive extraction tests
        run: |
          python3 -m unittest discover -s test -p 'test_lxc_isolated_extract.py' -v
          python3 -m unittest discover -s test -p 'test_lxc_stage_verify.py' -v
