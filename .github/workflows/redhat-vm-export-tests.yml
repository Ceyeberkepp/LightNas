name: Red Hat offline VM export tests
on:
  pull_request:
    paths:
      - 'scripts/export-redhat-offline-vm.py'
      - 'test/test_redhat_vm_export.py'
      - '.github/workflows/redhat-vm-export-tests.yml'
permissions:
  contents: read
jobs:
  test-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s test -p 'test_redhat_vm_export.py' -v
