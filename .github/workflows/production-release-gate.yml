name: Production release evidence gate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install production dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Run full application tests and platform contract
        run: |
          npm test
          npm run check:platform
      - name: Reject high or critical known production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Block release without independent operational evidence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-production-readiness.mjs --tag "$RELEASE_TAG"

# This workflow publishes nothing, installs nothing on hosts, and never
# modifies storage. A green check only validates supplied metadata/CI;
# the release owner must independently verify evidence and approve release.
