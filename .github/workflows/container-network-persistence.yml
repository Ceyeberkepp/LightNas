name: Container DHCP persistence tests
on:
  pull_request:
    paths:
      - 'scripts/lightnas-host-agent.py'
      - 'test/test_container_network_persistence.py'
      - '.github/workflows/container-network-persistence.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile scripts/lightnas-host-agent.py
      - run: python3 -m unittest discover -s test -p 'test_container_network_persistence.py' -v
