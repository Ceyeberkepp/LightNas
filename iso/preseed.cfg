# LightNAS installer defaults.
# Keep hardware/network discovery automatic while leaving destructive disk
# selection in the operator's hands.
d-i netcfg/choose_interface select auto
# Request a DHCP lease and use the router-provided IP, gateway and DNS when available.
# A missing lease falls back to the normal interactive installer network steps.
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/dhcp_timeout string 40
# Do not hardcode hostname/domain: let the operator choose a valid FQDN,
# including labels with hyphens and subdomains separated by dots.
d-i netcfg/get_hostname string lightnas
d-i netcfg/get_domain string local
# The Debian installer still presents hostname/domain fields for editing.
d-i clock-setup/utc boolean true
# Time zone is intentionally not preseeded. The installer asks the operator so
# a LightNAS appliance is not silently locked to the developer's time zone.

# LightNAS recommended disk layout.
# The target disk is intentionally NOT preseeded. Debian Installer still asks
# the operator which disk to erase/use.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select lightnas

# OS first, then use the remaining disk for LightNAS local data.
# The recipe is intentionally sized to fit the documented 35 GB minimum with
# margin for partition metadata: roughly 16-20 GiB root, 1-2 GiB swap, and at
# least 8 GiB for LightNAS local data. Larger disks give the remaining space to
# /var/lib/lightnas/storage/local.
# UEFI systems receive an EFI system partition. BIOS installs ignore that
# recipe item when the partition table is not GPT.
d-i partman-auto/expert_recipe string                         \
      lightnas ::                                            \
              538 538 1075 free                              \
                      $iflabel{ gpt }                         \
                      $reusemethod{ }                         \
                      method{ efi }                           \
                      format{ }                               \
              .                                               \
              16384 18432 20480 ext4                         \
                      $primary{ } $bootable{ }                \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ / }                         \
              .                                               \
              1024 1536 2048 linux-swap                      \
                      method{ swap } format{ }                \
              .                                               \
              8192 12000 1000000000 ext4                     \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ /var/lib/lightnas/storage/local } \
              .

# Keep the normal final confirmation screen. LightNAS never suppresses the
# destructive-write confirmation for the selected installation disk.
d-i partman/mount_style select uuid
